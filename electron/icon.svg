<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Rounded square background (macOS-style squircle approximation) -->
  <rect x="112" y="112" width="800" height="800" rx="184" fill="url(#bg)"/>

  <!-- Soft inner glow -->
  <circle cx="512" cy="512" r="340" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="192" y1="352" x2="832" y2="352"/>
    <line x1="192" y1="512" x2="832" y2="512"/>
    <line x1="192" y1="672" x2="832" y2="672"/>
    <line x1="352" y1="192" x2="352" y2="832"/>
    <line x1="512" y1="192" x2="512" y2="832"/>
    <line x1="672" y1="192" x2="672" y2="832"/>
  </g>

  <!-- Hermes "H" mark in a stylized sparkle -->
  <g transform="translate(512 512)">
    <!-- Four-pointed sparkle -->
    <path d="M 0,-240 C 40,-80 80,-40 240,0 C 80,40 40,80 0,240 C -40,80 -80,40 -240,0 C -80,-40 -40,-80 0,-240 Z"
          fill="url(#accent)" opacity="0.22"/>
    <path d="M 0,-180 C 30,-60 60,-30 180,0 C 60,30 30,60 0,180 C -30,60 -60,30 -180,0 C -60,-30 -30,-60 0,-180 Z"
          fill="url(#accent)" opacity="0.55"/>

    <!-- H letterform -->
    <g fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-weight="800">
      <text text-anchor="middle" dominant-baseline="central" font-size="260" y="8">H</text>
    </g>
  </g>

  <!-- Bottom caption "HERMES" -->
  <text x="512" y="820" text-anchor="middle" fill="#a5b4fc" opacity="0.7"
        font-family="-apple-system, system-ui, sans-serif"
        font-weight="600" font-size="58" letter-spacing="14">HERMES</text>
</svg>
